# OpenTelemetry Collector: single entry point for telemetry from the API, Celery worker and Celery beat.
#   traces  --> Tempo         metrics --> Prometheus (scrape :8889)        logs --> Loki (native OTLP)
# plus RED metrics derived from traces (spanmetrics connector).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 300
    spike_limit_mib: 80

  batch:
    timeout: 5s
    send_batch_size: 1024

  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

  # health probes every few seconds would drown real traces
  filter/drop-health:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(attributes["http.target"], "^/(health|livez).*")'
        - 'IsMatch(attributes["url.path"], "^/(health|livez).*")'
        - 'IsMatch(attributes["http.route"], "^/(health|livez).*")'

  # keep Prometheus label cardinality low
  transform/metric-labels:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.namespace", "service.instance.id", "deployment.environment"])

  # Append trace_id/span_id to the log body: Grafana links a log line to its trace with a plain regex.
  transform/log-trace-ids:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(body, Concat([body.string, " trace_id=", trace_id.string, " span_id=", span_id.string], "")) where IsString(body) and trace_id.string != "00000000000000000000000000000000"

connectors:
  # traces -> span_metrics_calls_total / span_metrics_duration_milliseconds_* (works for every service,
  # independent of which HTTP semantic-convention version the instrumentation emits)
  spanmetrics:
    namespace: span.metrics
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s]
    dimensions:
      - name: http.route
      - name: http.method
      - name: http.request.method
      - name: http.status_code
      - name: http.response.status_code
    exemplars:
      enabled: true
    metrics_flush_interval: 15s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true
    metric_expiration: 5m

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, filter/drop-health, batch]
      exporters: [otlp/tempo, spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, resource, transform/metric-labels, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform/log-trace-ids, batch]
      exporters: [otlphttp/loki]
  telemetry:
    logs:
      level: info
