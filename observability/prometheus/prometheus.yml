global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

# Alerting is done by Grafana-managed alert rules (observability/grafana/provisioning/alerting).
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # API / Celery worker / beat: HTTP RED metrics (from traces), business KPIs, process metrics, all via OTLP
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # containers and the host
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # data stores and queues
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: pgbouncer
    static_configs:
      - targets: ["pgbouncer-exporter:9127"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # RabbitMQ built-in exporter (plugin rabbitmq_prometheus): aggregated metrics
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  # ... and per-queue metrics (labels vhost, queue)
  - job_name: rabbitmq-detailed
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # uptime probes
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://api:8000/livez"]
        labels: { service: api }
      - targets: ["http://frontend/healthz"]
        labels: { service: frontend }
      - targets: ["http://mlflow:4000/health"]
        labels: { service: mlflow }
      - targets: ["http://mailpit:8025/livez"]
        labels: { service: mailpit }
      - targets: ["http://rabbitmq:15672/"]
        labels: { service: rabbitmq }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["postgres:5432"]
        labels: { service: postgres }
      - targets: ["pgbouncer:6432"]
        labels: { service: pgbouncer }
      - targets: ["redis:6379"]
        labels: { service: redis }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
