# Custom postgres_exporter queries (--extend.query-path). Metric name = <key>_<column>.
pg_custom_connections:
  query: |
    SELECT COALESCE(state, 'background') AS state, count(*)::float AS count
    FROM pg_stat_activity
    WHERE backend_type = 'client backend'
    GROUP BY 1
  metrics:
    - state: {usage: "LABEL", description: "Connection state"}
    - count: {usage: "GAUGE", description: "Client connections by state"}

pg_custom_limits:
  query: |
    SELECT (SELECT setting::float FROM pg_settings WHERE name = 'max_connections')                AS max_connections,
           (SELECT setting::float FROM pg_settings WHERE name = 'superuser_reserved_connections') AS reserved_connections
  metrics:
    - max_connections: {usage: "GAUGE", description: "max_connections"}
    - reserved_connections: {usage: "GAUGE", description: "superuser_reserved_connections"}

# 0 replicas / 0 lag on this single-node stack; goes live if a streaming replica is attached
pg_custom_replication:
  query: |
    SELECT count(*)::float AS replicas,
           COALESCE(max(EXTRACT(EPOCH FROM replay_lag)), 0)::float AS lag_seconds,
           COALESCE(max(pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn)), 0)::float AS lag_bytes
    FROM pg_stat_replication
  metrics:
    - replicas: {usage: "GAUGE", description: "Attached streaming replicas"}
    - lag_seconds: {usage: "GAUGE", description: "Replay lag of the slowest replica (seconds)"}
    - lag_bytes: {usage: "GAUGE", description: "Replay lag of the slowest replica (bytes of WAL)"}

pg_custom_waiting:
  query: |
    SELECT count(*) FILTER (WHERE wait_event_type = 'Lock')::float AS blocked_queries,
           COALESCE(max(EXTRACT(EPOCH FROM now() - query_start)) FILTER (WHERE state = 'active'), 0)::float AS longest_query_seconds
    FROM pg_stat_activity
    WHERE backend_type = 'client backend' AND pid <> pg_backend_pid()
  metrics:
    - blocked_queries: {usage: "GAUGE", description: "Queries waiting on a lock"}
    - longest_query_seconds: {usage: "GAUGE", description: "Longest running active query"}

pg_custom_statements:
  query: |
    SELECT COALESCE(sum(calls), 0)::float                    AS calls,
           COALESCE(sum(total_exec_time), 0)::float / 1000.0 AS seconds
    FROM pg_stat_statements s JOIN pg_database d ON d.oid = s.dbid
    WHERE d.datname = current_database()
  metrics:
    - calls: {usage: "COUNTER", description: "Statements executed"}
    - seconds: {usage: "COUNTER", description: "Total statement execution time"}

pg_custom_cache:
  query: |
    SELECT COALESCE(sum(blks_hit)::float / NULLIF(sum(blks_hit) + sum(blks_read), 0), 1) AS hit_ratio
    FROM pg_stat_database WHERE datname = current_database()
  metrics:
    - hit_ratio: {usage: "GAUGE", description: "Buffer cache hit ratio (0-1)"}
