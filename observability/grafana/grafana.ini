; Grafana configuration (mounted at /etc/grafana/grafana.ini). $__env{NAME} is read from the container environment.

[server]
root_url = http://localhost:3000

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[security]
allow_embedding = true

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/nextgen-overview.json

[log]
mode = console
level = info

; e-mail for Grafana-managed alerts. Defaults to the bundled Mailpit (http://localhost:8025).
[smtp]
enabled = true
host = $__env{SMTP_HOST}:$__env{SMTP_PORT}
user = $__env{SMTP_USER}
password = $__env{SMTP_PASSWORD}
from_address = $__env{SMTP_FROM}
from_name = NextGen Bank Alerts
startTLS_policy = $__env{SMTP_STARTTLS}
skip_verify = true

[unified_alerting]
enabled = true
execute_alerts = true
min_interval = 10s

[explore]
enabled = true
