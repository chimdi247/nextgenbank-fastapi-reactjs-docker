# Same-origin gateway: the browser only ever talks to this server (no CORS, auth cookies just work).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS: re-resolve `api` so the proxy survives API container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Links inside e-mails point at the API; when opened in a browser send people to the matching UI page.
    location ~ ^/api/v1/auth/activate/(?<token>[^/]+)$ {
        if ($http_accept ~* "text/html") { return 302 /activate/$token; }
        proxy_pass $api_upstream;
        include /etc/nginx/proxy_params_nextgen;
    }
    location ~ ^/api/v1/auth/reset-password/(?<token>[^/]+)$ {
        if ($http_accept ~* "text/html") { return 302 /reset-password/$token; }
        proxy_pass $api_upstream;
        include /etc/nginx/proxy_params_nextgen;
    }

    location /api/ {
        proxy_pass $api_upstream;
        include /etc/nginx/proxy_params_nextgen;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
