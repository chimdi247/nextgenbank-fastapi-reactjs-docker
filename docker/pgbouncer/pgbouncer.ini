;; PgBouncer: connection pooler between the API / Celery workers and PostgreSQL.
;; The application connects to pgbouncer:6432 (DATABASE_URL); Alembic migrations bypass it (DATABASE_DIRECT_URL).

[databases]
nextgen = host=postgres port=5432 dbname=nextgen

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; admin console (SHOW POOLS ...). The exporter only needs read access.
admin_users = pgbouncer_admin
stats_users = pgbouncer_exporter

;; transaction pooling: a server connection is held only for the duration of one transaction.
;; (the app disables asyncpg's prepared-statement cache for this: DB_USE_PGBOUNCER=true)
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 0

query_wait_timeout = 30
server_login_retry = 3
server_connect_timeout = 10
server_idle_timeout = 300
client_login_timeout = 30

ignore_startup_parameters = extra_float_digits,options,application_name

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 15
